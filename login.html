<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login — FNS Realty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <div class="container auth-wrap">
    <!-- Step 1: login / signup -->
    <div class="panel" id="authPanel">
      <h2 style="text-align:center;margin-bottom:6px">Welcome to FNS</h2>
      <p style="text-align:center;color:var(--muted);margin-bottom:20px">One-time signup with email verification.</p>
      <div class="tabs">
        <button id="tabLogin" class="active" onclick="setMode('login')">Login</button>
        <button id="tabSignup" onclick="setMode('signup')">Sign up</button>
      </div>

      <form onsubmit="submitAuth(event)">
        <div class="form-field" id="nameField" style="display:none;margin-bottom:14px">
          <label>Full name</label>
          <input id="name" placeholder="Your name">
        </div>
        <div class="form-field" style="margin-bottom:14px">
          <label>Email</label>
          <input id="email" type="email" required placeholder="you@example.com">
        </div>
        <div class="form-field" style="margin-bottom:14px">
          <label>Password</label>
          <input id="password" type="password" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-field" id="roleField" style="display:none;margin-bottom:14px">
          <label>I am a</label>
          <select id="role">
            <option value="buyer">Buyer / Tenant</option>
            <option value="owner">Owner</option>
            <option value="realtor">Realtor / Mediator</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" style="height:46px" id="authBtn">Login</button>
      </form>
    </div>

    <!-- Step 2: OTP verification -->
    <div class="panel" id="otpPanel" style="display:none">
      <h2 style="text-align:center;margin-bottom:6px">Verify your email</h2>
      <p style="text-align:center;color:var(--muted)" id="otpSub">We emailed a 6-digit code.</p>
      <div class="otp-row" id="otpRow">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
      </div>
      <button class="btn btn-primary btn-block" style="height:46px" onclick="verifyOtp()" id="verifyBtn">Verify & continue</button>
      <p style="text-align:center;margin-top:14px;font-size:14px;color:var(--muted)">
        Didn't get it? <a href="#" onclick="resendOtp(event)" style="color:var(--brand);font-weight:700">Resend code</a>
      </p>
      <div class="demo-otp" id="demoOtp" style="display:none"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    injectChrome("");
    let mode = "login";
    let pendingEmail = "";
    const next = new URLSearchParams(location.search).get("next") || "account.html";

    function setMode(m){
      mode = m;
      document.getElementById("tabLogin").classList.toggle("active", m === "login");
      document.getElementById("tabSignup").classList.toggle("active", m === "signup");
      document.getElementById("nameField").style.display = m === "signup" ? "block" : "none";
      document.getElementById("roleField").style.display = m === "signup" ? "block" : "none";
      document.getElementById("name").required = m === "signup";
      document.getElementById("authBtn").textContent = m === "login" ? "Login" : "Create account";
    }

    function showOtpStep(resp){
      pendingEmail = resp.email;
      document.getElementById("authPanel").style.display = "none";
      document.getElementById("otpPanel").style.display = "block";
      document.getElementById("otpSub").textContent = "We emailed a 6-digit code to " + pendingEmail + ". It expires in 10 minutes.";
      if (resp.demo_otp) {
        const d = document.getElementById("demoOtp");
        d.style.display = "block";
        d.innerHTML = "🧪 <b>Demo mode</b> (no SMTP configured): your OTP is <b>" + resp.demo_otp + "</b>";
      }
      document.querySelector("#otpRow input").focus();
    }

    async function submitAuth(e){
      e.preventDefault();
      const btn = document.getElementById("authBtn");
      btn.disabled = true;
      try {
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        if (mode === "signup") {
          const resp = await API.post("/auth/signup", {
            name: document.getElementById("name").value.trim(),
            email, password,
            role: document.getElementById("role").value
          });
          toast("Account created — check your email for the OTP");
          showOtpStep(resp);
        } else {
          const resp = await API.post("/auth/login", { email, password });
          if (resp.needsOtp) { toast("Please verify your email first"); showOtpStep(resp); }
          else {
            saveSession(resp.token, resp.user);
            toast("Logged in ✔");
            setTimeout(() => location.href = next, 600);
          }
        }
      } catch (err) { toast(err.message); }
      btn.disabled = false;
    }

    // OTP boxes: auto-advance, backspace, paste
    const boxes = [...document.querySelectorAll("#otpRow input")];
    boxes.forEach((b, i) => {
      b.addEventListener("input", () => {
        b.value = b.value.replace(/\D/g, "").slice(0, 1);
        if (b.value && i < 5) boxes[i + 1].focus();
      });
      b.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !b.value && i > 0) boxes[i - 1].focus();
      });
      b.addEventListener("paste", e => {
        const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
        if (digits.length) {
          e.preventDefault();
          digits.split("").forEach((d, j) => { if (boxes[j]) boxes[j].value = d; });
          boxes[Math.min(digits.length, 5)].focus();
        }
      });
    });

    async function verifyOtp(){
      const otp = boxes.map(b => b.value).join("");
      if (otp.length !== 6) { toast("Enter the 6-digit code"); return; }
      const btn = document.getElementById("verifyBtn");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verifying…';
      try {
        const resp = await API.post("/auth/verify", { email: pendingEmail, otp });
        saveSession(resp.token, resp.user);
        btn.innerHTML = "✓ Verified";
        toast("Email verified — welcome to FNS 🎉");
        setTimeout(() => location.href = next, 700);
      } catch (err) {
        toast(err.message);
        btn.disabled = false; btn.textContent = "Verify & continue";
      }
    }

    async function resendOtp(e){
      e.preventDefault();
      try {
        const resp = await API.post("/auth/resend", { email: pendingEmail });
        toast("New code sent 📩");
        if (resp.demo_otp) {
          const d = document.getElementById("demoOtp");
          d.style.display = "block";
          d.innerHTML = "🧪 <b>Demo mode</b>: your new OTP is <b>" + resp.demo_otp + "</b>";
        }
      } catch (err) { toast(err.message); }
    }
  </script>
</body>
</html>
