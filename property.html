<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details — FNS Realty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <section class="section" id="detailSection" style="padding-top:34px">
    <div class="container" id="detailRoot"><div class="empty"><p>Loading…</p></div></div>
  </section>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    injectChrome("");
    const id = new URLSearchParams(location.search).get("id");
    const root = document.getElementById("detailRoot");
    let prop = null;

    async function load(){
      try {
        await loadShortlist();
        prop = await fetchProperty(id);
      } catch (e) { prop = null; }
      if (!prop) {
        root.innerHTML = `<div class="empty"><h3>Property not found</h3>
          <a class="btn btn-primary" style="margin-top:16px" href="listings.html">Browse all properties</a></div>`;
        return;
      }
      render();
    }

    function render(){
      const p = prop;
      document.title = p.title + " — FNS Realty";
      const isRent = p.type === "rent";
      const shortlisted = getShortlist().includes(p.id);
      const photos = p.photos && p.photos.length ? p.photos :
        [p.img, ...(p.img && p.img.includes("picsum") ? [1,2,3].map(n => p.img.replace("/800/500", `-${n}/800/500`).replace("seed/", "seed/x")) : [])].filter(Boolean);

      root.innerHTML = `
      <div style="margin-bottom:18px">
        <a href="listings.html" style="color:var(--brand);font-weight:700;font-size:14px">← Back to search</a>
      </div>
      <div class="detail-grid">
        <div>
          <div class="gallery reveal in">
            <div class="main"><img id="mainImg" src="${photos[0]}" alt="${p.title}" onerror="this.style.display='none'"></div>
          </div>
          ${photos.length > 1 ? `<div class="thumbs">${photos.map((ph,i) =>
            `<img src="${ph}" class="${i===0?'sel':''}" onclick="swapImg('${ph}',this)" onerror="this.remove()">`).join("")}</div>` : ""}

          ${p.video ? `<div class="panel" style="margin-top:18px"><h3 style="margin-bottom:10px">Video tour</h3>
            <video controls style="width:100%;border-radius:10px" src="${p.video}"></video></div>` : ""}

          <div class="panel reveal in" style="margin-top:22px">
            <h3>About this property</h3>
            <p style="color:var(--muted);margin-top:10px">${p.desc}</p>
            <div class="spec-list">
              <div class="s"><small>Type</small><b>${isRent ? "For Rent" : "For Sale"} · ${p.category === "new" ? "New Project" : "Resale"}</b></div>
              <div class="s"><small>Configuration</small><b>${p.beds} BHK · ${p.baths} Bath</b></div>
              <div class="s"><small>Built-up area</small><b>${p.sqft} sqft</b></div>
              <div class="s"><small>Pincode</small><b>${p.pincode}</b></div>
            </div>
          </div>

          <div class="panel" style="margin-top:22px;padding:0;overflow:hidden">
            <div class="map-wrap" style="border:0;border-radius:0;height:340px">
              <iframe loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(p.area + ", " + p.city + " " + p.pincode)}&t=&z=14&ie=UTF8&iwloc=&output=embed"></iframe>
            </div>
          </div>
        </div>

        <div class="sidebar-card">
          <div class="panel">
            <div class="price" style="font-size:30px;font-weight:800">${fmtPrice(p.priceINR, isRent)}</div>
            <h2 style="font-size:20px;margin-top:6px">${p.title}</h2>
            <div class="loc" style="color:var(--muted);margin-top:6px">📍 ${p.area}, ${p.city} — ${p.pincode}</div>

            <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
              <button class="btn btn-accent btn-block" onclick="openVisitModal()">📅 Book a site visit — ₹999 token</button>
              <button class="btn btn-primary btn-block" onclick="enquireEmail(prop)">✉ Interested? Enquire by email</button>
              <a class="btn btn-primary btn-block" style="background:var(--wa)" target="_blank"
                 href="${whatsappLink(`Hi FNS! I'm interested in "${p.title}" (${p.id}) in ${p.area}, ${p.city}. Please share details / book a visit.`)}">🟢 WhatsApp us</a>
              <button class="btn btn-ghost btn-block" id="shortBtn" onclick="toggleShortlist('${p.id}', null).then(refreshShort)">
                ${shortlisted ? "♥ Shortlisted" : "♡ Add to shortlist"}
              </button>
            </div>
            <p style="color:var(--muted);font-size:12.5px;margin-top:14px">The ₹999 visit token is fully refundable and confirms your slot instantly — search → shortlist → visit → invoice → pay → support, all on FNS.</p>
          </div>
        </div>
      </div>`;
    }

    function swapImg(src, el){
      document.getElementById("mainImg").src = src;
      document.querySelectorAll(".thumbs img").forEach(i => i.classList.remove("sel"));
      el.classList.add("sel");
    }
    function refreshShort(){
      const btn = document.getElementById("shortBtn");
      if (btn) btn.innerHTML = getShortlist().includes(prop.id) ? "♥ Shortlisted" : "♡ Add to shortlist";
    }

    // ---- Book visit: date modal → create booking + invoice → pay ----
    function openVisitModal(){
      const user = currentUser();
      if (!user) {
        toast("Please login to book a visit");
        setTimeout(() => location.href = "login.html?next=" + encodeURIComponent("property.html?id=" + prop.id), 900);
        return;
      }
      document.getElementById("visitModal")?.remove();
      const wrap = document.createElement("div");
      wrap.id = "visitModal"; wrap.className = "modal-overlay";
      const min = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
      wrap.innerHTML = `
      <div class="modal">
        <div class="pay-head">
          <div><b>Book a site visit</b><small>${prop.title} — ${prop.area}, ${prop.city}</small></div>
          <button class="x" onclick="document.getElementById('visitModal').remove()">×</button>
        </div>
        <div class="form-field" style="margin:16px 0">
          <label>Preferred date</label>
          <input type="date" id="visitDate" min="${min}" value="${min}">
        </div>
        <div class="form-field" style="margin-bottom:16px">
          <label>Preferred time</label>
          <select id="visitTime"><option>Morning (10am–12pm)</option><option>Afternoon (12pm–4pm)</option><option>Evening (4pm–7pm)</option></select>
        </div>
        <button class="btn btn-primary btn-block" style="height:46px" id="visitBtn">Continue to pay ₹999 token</button>
        <p class="pay-note">Fully refundable. Your slot is confirmed the moment payment succeeds.</p>
      </div>`;
      document.body.appendChild(wrap);
      document.getElementById("visitBtn").onclick = async () => {
        const btn = document.getElementById("visitBtn");
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating booking…';
        try {
          const datePref = document.getElementById("visitDate").value + ", " + document.getElementById("visitTime").value;
          const resp = await API.post("/bookings", { property_id: prop.id, date_pref: datePref });
          wrap.remove();
          openCheckout(
            { id: resp.invoice_id, amount: resp.amount, description: "Site-visit token — " + prop.title },
            () => toast("Visit confirmed 🎉 See it under My Account")
          );
        } catch (e) {
          toast(e.message);
          btn.disabled = false; btn.textContent = "Continue to pay ₹999 token";
        }
      };
    }

    load();
  </script>
</body>
</html>
