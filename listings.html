<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Properties — FNS Realty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <section class="page-head">
    <div class="container">
      <h1 id="pageTitle">Properties</h1>
      <p id="pageSub">Search by city, area, pincode and budget.</p>
    </div>
  </section>

  <section class="section" style="padding-top:28px">
    <div class="container">
      <form class="search-card" style="margin-top:0" onsubmit="applyFilters(event)">
        <div class="search-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr auto">
          <div class="field">
            <label>City / Area</label>
            <input id="q" placeholder="City or area">
          </div>
          <div class="field">
            <label>Pincode</label>
            <input id="pincode" placeholder="Pincode" inputmode="numeric">
          </div>
          <div class="field">
            <label>Buy / Rent</label>
            <select id="type">
              <option value="">Any</option>
              <option value="buy">Buy</option>
              <option value="rent">Rent</option>
            </select>
          </div>
          <div class="field">
            <label>Type</label>
            <select id="category">
              <option value="">Any</option>
              <option value="new">New Project</option>
              <option value="resale">Resale</option>
            </select>
          </div>
          <div class="field">
            <label>Budget (max ₹)</label>
            <input id="budget" placeholder="e.g. 10000000" inputmode="numeric">
          </div>
          <div class="field">
            <button class="btn btn-primary" style="height:44px" type="submit">Filter</button>
          </div>
        </div>
      </form>

      <div class="section-head" style="margin-top:30px">
        <p id="resultCount" style="font-weight:700"></p>
        <select class="currency" id="sort" onchange="render()">
          <option value="">Sort: Default</option>
          <option value="asc">Price: Low → High</option>
          <option value="desc">Price: High → Low</option>
        </select>
      </div>

      <div class="grid" id="resultsGrid"></div>
      <div class="empty" id="emptyState" style="display:none">
        <h3>No properties match your filters</h3>
        <p style="margin-top:6px">Try widening the budget or clearing the pincode.</p>
        <a class="btn btn-primary" style="margin-top:16px" href="listings.html">Clear all filters</a>
      </div>

      <div class="section-head" style="margin-top:44px"><div><span class="eyebrow">Location</span><h2 style="font-size:22px">Results on map</h2></div></div>
      <div class="map-wrap" style="height:320px"><iframe id="mapFrame" loading="lazy"></iframe></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    injectChrome(params.get("type") || "");
    let allProps = [];

    // hydrate filter inputs from URL
    ["q","pincode","type","category","budget"].forEach(k => {
      if (params.get(k)) document.getElementById(k).value = params.get(k);
    });

    function applyFilters(e){
      e.preventDefault();
      const p = new URLSearchParams();
      ["q","pincode","type","category","budget"].forEach(k => {
        const v = document.getElementById(k).value.trim();
        if (v) p.set(k, v);
      });
      location.href = "listings.html?" + p.toString();
    }

    function render(){
      let list = [...allProps];
      const sort = document.getElementById("sort").value;
      if (sort === "asc") list.sort((a,b)=>a.priceINR-b.priceINR);
      if (sort === "desc") list.sort((a,b)=>b.priceINR-a.priceINR);
      document.getElementById("resultCount").textContent = list.length + " propert" + (list.length===1?"y":"ies") + " found";
      document.getElementById("resultsGrid").innerHTML = list.map((p,i) => propertyCard(p, Math.min(i,6)*60)).join("");
      document.getElementById("emptyState").style.display = list.length ? "none" : "block";
      // map: center on first result's city, else India
      const q = list.length ? (list[0].area + ", " + list[0].city) : "India";
      document.getElementById("mapFrame").src =
        "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&t=&z=" + (list.length?12:5) + "&ie=UTF8&iwloc=&output=embed";
      initReveal();
    }

    async function load(){
      await loadShortlist();
      const filters = {};
      ["q","pincode","type","category","budget"].forEach(k => { if (params.get(k)) filters[k] = params.get(k); });
      allProps = await fetchProperties(filters).catch(() => []);
      render();
    }

    // page title from filters
    const t = params.get("type");
    if (t === "buy") document.getElementById("pageTitle").textContent = "Homes for Sale";
    else if (t === "rent") document.getElementById("pageTitle").textContent = "Homes for Rent";
    else if (params.get("category") === "new") document.getElementById("pageTitle").textContent = "New Projects";
    else if (params.get("category") === "resale") document.getElementById("pageTitle").textContent = "Resale Homes";

    load();
  </script>
</body>
</html>
