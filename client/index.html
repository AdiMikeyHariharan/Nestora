<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Primary SEO -->
  <title>Nestora — Buy, Rent &amp; Sell Homes in India | Verified Listings</title>
  <meta name="description" content="Nestora is India's smart property platform — search verified flats, houses and plots to buy or rent with AI landmark search, maps, price/sqft insights and free owner listings. Find your nest." />
  <meta name="keywords" content="property in India, buy flat, rent apartment, real estate, houses for sale, 2 BHK, 3 BHK, property listings, owner properties, Nestora" />
  <meta name="author" content="Nestora" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#059669" />
  <link rel="canonical" href="https://www.nestora.properties/" />

  <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nestora" />
  <meta property="og:title" content="Nestora — Buy, Rent &amp; Sell Homes in India" />
  <meta property="og:description" content="Search verified homes to buy or rent with AI landmark search, maps and price insights. List your property free." />
  <meta property="og:url" content="https://www.nestora.properties/" />
  <meta property="og:image" content="https://www.nestora.properties/logo.png" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nestora — Buy, Rent &amp; Sell Homes in India" />
  <meta name="twitter:description" content="Verified property listings with AI search, maps and price insights. Find your nest." />
  <meta name="twitter:image" content="https://www.nestora.properties/logo.png" />

  <!-- Structured data: brand + site search box in Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "RealEstateAgent",
        "@id": "https://www.nestora.properties/#org",
        "name": "Nestora",
        "url": "https://www.nestora.properties/",
        "logo": "https://www.nestora.properties/logo.png",
        "areaServed": "IN",
        "description": "India's smart property platform to buy, rent and sell verified homes."
      },
      {
        "@type": "WebSite",
        "@id": "https://www.nestora.properties/#website",
        "url": "https://www.nestora.properties/",
        "name": "Nestora",
        "publisher": { "@id": "https://www.nestora.properties/#org" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.nestora.properties/listings?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
